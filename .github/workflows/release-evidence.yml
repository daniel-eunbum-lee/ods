name: release-evidence

# When a release is published: re-run the full test matrix and attach the evidence (JUnit,
# coverage, verification metrics, provenance for every platform) to that release, with a
# SHA-256 file, so each released version carries its own verification record.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  attach:
    name: Attach evidence to the release
    needs: tests
    # Also when the tests failed: a release whose tests failed should say so in its record.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only to upload the two files below to this release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: evidence

      - name: Bundle and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          safe_tag="${TAG//\//_}" # a tag may contain "/", which cannot go in a file name
          bundle="ods-${safe_tag}-ci-evidence.zip"
          zip -r -q "$bundle" evidence
          sha256sum "$bundle" > "$bundle.sha256"
          gh release upload "$TAG" "$bundle" "$bundle.sha256" --clobber --repo "$GITHUB_REPOSITORY"
