name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python (requires-python >= 3.11) and the newest stable one; Windows
        # too, because file encodings and paths differ there.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      # Actions are pinned to commit SHAs; the comment gives the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (exactly as locked)
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -ra
