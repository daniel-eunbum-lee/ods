name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release-evidence.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Python (requires-python >= 3.11) and the newest stable one; Windows
        # too, because file encodings and paths differ there.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      # Actions are pinned to commit SHAs; the comment gives the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9" # pinned so a new uv release can't change --locked behaviour
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (exactly as locked)
        run: uv sync --locked

      # Tests double as verification evidence: JUnit report, coverage (with the floor from
      # pyproject.toml), and the benchmark's measured errors (verification_metrics.json).
      - name: Run tests
        env:
          ODS_EVIDENCE_DIR: evidence
        run: >
          uv run pytest -ra
          --junitxml=evidence/junit.xml
          --cov --cov-report=term --cov-report=xml:evidence/coverage.xml --cov-report=html:evidence/htmlcov

      # After the tests, and not only on success, so a lint failure cannot hide the test evidence.
      - name: Lint (bug-finding rules; configured in pyproject.toml)
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      # always(): a failing run is exactly the one whose evidence matters.
      - name: Record provenance
        if: always()
        env:
          ODS_EVIDENCE_DIR: evidence
        run: uv run --locked python .github/scripts/provenance.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
